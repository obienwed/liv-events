name: Update LIV events
on:
  schedule:
    - cron: "0 14 * * *"   # daily, 7am Las Vegas time
  workflow_dispatch:        # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  scrape:
    runs-on: self-hosted    # runs on your Mac (LIV blocks GitHub's servers)
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python packages
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q requests beautifulsoup4 curl_cffi
      - name: Scrape LIV lineups
        run: .venv/bin/python scrape_liv.py
      - name: Commit if changed
        run: |
          git config user.name "liv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json beach-events.json
          git diff --cached --quiet || (git commit -m "Update LIV events" && git push)
