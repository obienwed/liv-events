name: Update LIV events
on:
  schedule:
    - cron: "0 14 * * *"   # daily, 7am Las Vegas time
  workflow_dispatch:        # adds a "Run workflow" button
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scrape_liv.py
      - name: Commit if changed
        run: |
          git config user.name "liv-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Update LIV events" && git push)
